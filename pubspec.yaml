name: cloudpayments_sdk
description: >-
  CloudPayments for Flutter: card validation, cryptogram generation through the
  official native iOS and Android SDKs, the Payment API, and 3-D Secure in a
  native WebView.
version: 0.3.0
repository: https://github.com/arxdeus/cloudpayments_sdk
issue_tracker: https://github.com/arxdeus/cloudpayments_sdk/issues

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  meta: ^1.15.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.arxdeus.flutter.cloudpayments_sdk
        pluginClass: CloudpaymentsSdkPlugin
      ios:
        pluginClass: CloudpaymentsSdkPlugin
