org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=false

# The CloudPayments AAR requires compileSdk 37. An Android Gradle Plugin that
# predates API 37 will refuse an unfamiliar compileSdk unless it is told not to.
android.suppressUnsupportedCompileSdk=37
